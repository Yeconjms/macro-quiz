<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta property="og:title" content="매크로 마스터 아케이드">
<meta property="og:description" content="15문제 안에 레벨이 갈린다 — CPI, 연준, GDP, LEI, 재정수지, 노동시장. 당신은 몇 티어?">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0B0B1A">
<title>매크로 마스터 아케이드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0B0B1A;--card:#1a1a35;--mint:#00E5A0;--pink:#FF6B9D;--yellow:#FFD93D;--red:#FF4757;--teal:#4ECDC4;--purple:#A78BFA;--text:#fff;--muted:rgba(255,255,255,.5);--radius:14px}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:var(--text);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:linear-gradient(135deg,#0B0B1A 0%,#1A1030 50%,#0B1A2E 100%);background-size:400% 400%;animation:bgShift 12s ease infinite}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
#app{width:100%;max-width:440px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;padding:20px 20px env(safe-area-inset-bottom,20px);opacity:0;pointer-events:none;transition:opacity .35s ease,transform .35s ease;transform:translateY(12px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.screen.active{opacity:1;pointer-events:auto;transform:translateY(0)}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.particle{position:absolute;border-radius:50%;opacity:.25;animation:floatP linear infinite}
@keyframes floatP{0%{transform:translateY(100vh) scale(0)}50%{opacity:.4}100%{transform:translateY(-20vh) scale(1);opacity:0}}

/* ── START ── */
.start-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:1}
.macro-banner{width:100%;max-width:300px;padding:14px;border-radius:var(--radius);background:linear-gradient(135deg,rgba(0,229,160,.12),rgba(78,205,196,.08));border:1.5px solid rgba(0,229,160,.3);text-align:center;margin-bottom:4px}
.macro-banner-top{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.macro-banner-name{font-size:20px;font-weight:800;color:var(--mint);letter-spacing:-.5px}
.macro-banner-sub{font-size:12px;color:var(--teal);margin-top:4px}
.logo{text-align:center}
.logo-icon{font-size:52px;display:block;animation:bounce 2s ease infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.logo h1{font-size:26px;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,var(--mint),var(--teal),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 200%;animation:gradText 3s ease infinite}
@keyframes gradText{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo p{color:var(--muted);font-size:13px;margin-top:5px}
.input-wrap{width:100%;max-width:300px}
.input-wrap input{width:100%;padding:14px 16px;font-size:16px;border:2px solid rgba(255,255,255,.12);border-radius:var(--radius);background:var(--card);color:var(--text);text-align:center;outline:none;transition:border-color .25s}
.input-wrap input:focus{border-color:var(--mint)}
.input-wrap input::placeholder{color:var(--muted)}
.btn{width:100%;max-width:300px;padding:15px;font-size:17px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;transition:transform .12s;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.96)}
.btn-primary{background:linear-gradient(135deg,var(--mint),var(--teal));color:#0B0B1A;box-shadow:0 4px 20px rgba(0,229,160,.25)}
.btn-secondary{background:var(--card);color:var(--text);border:2px solid rgba(255,255,255,.1)}
.btn-pink{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;box-shadow:0 4px 20px rgba(255,107,157,.2)}
.btn:disabled{opacity:.4;pointer-events:none}
.start-footer{color:var(--muted);font-size:11px;text-align:center;padding-top:4px}

/* ── COUNTDOWN ── */
.cd-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(11,11,26,.92);backdrop-filter:blur(8px)}
.cd-num{font-size:80px;font-weight:900;animation:countPop .55s ease;background:linear-gradient(135deg,var(--mint),var(--pink));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
@keyframes countPop{0%{transform:scale(2.5);opacity:0}60%{transform:scale(.9);opacity:1}100%{transform:scale(1)}}

/* ── GAME ── */
.game-top{display:flex;align-items:center;justify-content:space-between;padding-bottom:10px}
.sound-btn{background:none;border:none;font-size:22px;cursor:pointer;padding:6px;opacity:.7}
.game-meta{display:flex;align-items:center;gap:12px}
.game-progress{font-size:13px;font-weight:600;color:var(--muted)}.game-progress span{color:var(--text)}
.lives{display:flex;gap:3px;font-size:16px}
.combo-badge{font-size:12px;font-weight:800;color:var(--yellow);padding:3px 8px;border-radius:10px;background:rgba(255,217,61,.15);display:none;animation:popIn .3s ease}
.combo-badge.show{display:inline-block}
.timer-bar{width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,.08);margin-bottom:14px;overflow:hidden}
.timer-fill{height:100%;border-radius:3px;transition:width .1s linear,background .3s;background:var(--mint)}
.timer-fill.warn{background:var(--yellow)}.timer-fill.danger{background:var(--red);animation:pulse .5s infinite}
.diff-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:10px;letter-spacing:.5px}
.diff-easy{background:rgba(0,229,160,.15);color:var(--mint)}.diff-normal{background:rgba(255,217,61,.15);color:var(--yellow)}.diff-hard{background:rgba(255,71,87,.15);color:var(--red)}
.question-area{flex:1;display:flex;flex-direction:column;justify-content:center}
.question-text{font-size:18px;font-weight:600;line-height:1.6;margin-bottom:18px;min-height:54px;word-break:keep-all}
.options{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.option-btn{width:100%;padding:14px 16px;font-size:15px;font-weight:500;text-align:left;border:2px solid rgba(255,255,255,.08);border-radius:var(--radius);background:var(--card);color:var(--text);cursor:pointer;transition:all .15s;-webkit-user-select:none;user-select:none;display:flex;align-items:center;gap:10px}
.option-btn:active:not(.locked){background:rgba(255,255,255,.08);transform:scale(.98)}
.option-btn .ol{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.06)}
.option-btn.correct{border-color:var(--mint);background:rgba(0,229,160,.1);animation:popIn .3s ease}
.option-btn.correct .ol{background:var(--mint);color:#0B0B1A}
.option-btn.wrong{border-color:var(--red);background:rgba(255,71,87,.1);animation:shake .35s ease}
.option-btn.wrong .ol{background:var(--red);color:#fff}
.option-btn.locked{pointer-events:none;opacity:.4}.option-btn.correct.locked{opacity:1}
.score-pop{position:fixed;left:50%;font-size:22px;font-weight:800;pointer-events:none;z-index:50;animation:floatUp .9s ease-out forwards}
.score-pop.bonus{color:var(--mint)}.score-pop.combo{color:var(--yellow);font-size:18px}
@keyframes floatUp{0%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-80px)}}

/* ── RESULT ── */
.result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;position:relative;z-index:1}
.tier-icon{font-size:64px;animation:popIn .5s ease}
.tier-name{font-size:22px;font-weight:800;letter-spacing:-1px}
.tier-sub{color:var(--muted);font-size:13px;font-style:italic}
.result-score{font-size:40px;font-weight:800;background:linear-gradient(135deg,var(--mint),var(--teal));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:2px 0}
.result-detail{color:var(--muted);font-size:13px}
.result-rank{padding:8px 20px;border-radius:var(--radius);background:var(--card);font-size:14px;border:1px solid rgba(255,255,255,.06)}
.result-rank strong{color:var(--mint)}
.channel-row{display:flex;gap:10px;width:100%;max-width:300px;margin:6px 0}
.ch-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 10px;border-radius:var(--radius);text-decoration:none;font-size:14px;font-weight:700;transition:transform .12s}
.ch-btn:active{transform:scale(.96)}
.ch-tg{background:linear-gradient(135deg,#0088cc,#00aaee);color:#fff}
.ch-yt{background:linear-gradient(135deg,#FF0000,#CC0000);color:#fff}
.result-btns{width:100%;max-width:300px;display:flex;flex-direction:column;gap:9px}
.watermark{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:rgba(255,255,255,.18);font-weight:700;letter-spacing:2px;text-transform:uppercase;pointer-events:none;white-space:nowrap}
.share-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--mint);color:#0B0B1A;padding:10px 24px;border-radius:var(--radius);font-size:14px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
.share-toast.show{opacity:1}
.confetti{position:absolute;width:8px;height:8px;border-radius:2px;animation:confettiDrop linear forwards;pointer-events:none}
@keyframes confettiDrop{0%{transform:translateY(-20px) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}

/* ── LEADERBOARD ── */
.lb-title{font-size:20px;font-weight:800;text-align:center;margin-bottom:12px}
.lb-list{flex:1;display:flex;flex-direction:column;gap:7px;overflow-y:auto;padding-bottom:10px}
.lb-row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--radius);background:var(--card);font-size:14px}
.lb-row.me{border:2px solid var(--mint);background:rgba(0,229,160,.06)}
.lb-rank{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;background:rgba(255,255,255,.06)}
.lb-row:nth-child(1) .lb-rank{background:linear-gradient(135deg,#FFD700,#FFA500);color:#0B0B1A}
.lb-row:nth-child(2) .lb-rank{background:linear-gradient(135deg,#C0C0C0,#888);color:#0B0B1A}
.lb-row:nth-child(3) .lb-rank{background:linear-gradient(135deg,#CD7F32,#A0522D);color:#fff}
.lb-name{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-score{font-weight:700;color:var(--mint);font-size:13px}
.lb-tier{font-size:15px}
.lb-empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
.lb-cta{width:100%;margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:8px;align-items:center}
.lb-cta-text{font-size:13px;color:var(--muted);text-align:center}
.lb-cta-row{display:flex;gap:8px;width:100%;max-width:300px}
.lb-cta-btn{flex:1;padding:12px;border-radius:var(--radius);text-decoration:none;font-size:13px;font-weight:700;text-align:center;transition:transform .12s}
.lb-cta-btn:active{transform:scale(.96)}
.back-btn{padding-top:8px}

@keyframes popIn{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@media(max-height:680px){.logo-icon{font-size:40px}.logo h1{font-size:22px}.macro-banner{padding:10px}.question-text{font-size:16px;min-height:44px}.option-btn{padding:12px 14px;font-size:14px}.tier-icon{font-size:48px}.result-score{font-size:32px}}
</style>
</head>
<body>
<div class="particles" id="particles"></div>
<div id="app">
  <div id="screen-start" class="screen active">
    <div class="start-wrap">
      <div class="macro-banner">
        <div class="macro-banner-top">presents</div>
        <div class="macro-banner-name">📡 Macro OK</div>
        <div class="macro-banner-sub">매크로 경제, 쉽고 재밌게</div>
      </div>
      <div class="logo"><span class="logo-icon">🎮</span><h1>매크로 마스터<br>아케이드</h1><p>15문제 안에 레벨이 갈린다</p></div>
      <div class="input-wrap"><input id="nickname" type="text" placeholder="닉네임을 입력하세요" maxlength="12" autocomplete="off"></div>
      <button class="btn btn-primary" id="btn-start" disabled>🚀 게임 시작</button>
      <button class="btn btn-secondary" id="btn-lb-start">🏆 리더보드</button>
      <div class="start-footer">CPI · 연준 · GDP · LEI · 재정수지 · 노동시장</div>
    </div>
  </div>
  <div id="screen-game" class="screen">
    <div class="game-top"><button class="sound-btn" id="btn-sound">🔊</button><span class="combo-badge" id="combo-badge"></span><div class="game-meta"><div class="game-progress"><span id="q-num">1</span>/<span id="q-total">15</span></div><div class="lives" id="lives"></div></div></div>
    <div class="timer-bar"><div class="timer-fill" id="timer-fill"></div></div>
    <div id="diff-badge" class="diff-badge diff-easy">EASY</div>
    <div class="question-area"><div class="question-text" id="question-text"></div><div class="options" id="options"></div></div>
  </div>
  <div id="screen-result" class="screen">
    <div class="result-wrap" id="result-wrap">
      <div class="tier-icon" id="tier-icon"></div>
      <div class="tier-name" id="tier-name"></div>
      <div class="tier-sub" id="tier-sub"></div>
      <div class="result-score" id="result-score"></div>
      <div class="result-detail" id="result-detail"></div>
      <div class="result-rank" id="result-rank"></div>
      <div class="channel-row">
        <a class="ch-btn ch-tg" href="https://t.me/macro_OK" target="_blank">📡 텔레그램</a>
        <a class="ch-btn ch-yt" href="https://www.youtube.com/@simple_insight" target="_blank">▶️ 유튜브</a>
      </div>
      <div class="result-btns">
        <button class="btn btn-primary" id="btn-share">📋 결과 공유하기</button>
        <button class="btn btn-secondary" id="btn-lb-result">🏆 리더보드</button>
        <button class="btn btn-pink" id="btn-retry">🔄 다시 도전</button>
      </div>
    </div>
    <div class="watermark">MACRO OK · 매크로 경제, 쉽고 재밌게</div>
    <div class="share-toast" id="share-toast">클립보드에 복사됨!</div>
  </div>
  <div id="screen-lb" class="screen">
    <div class="lb-title">🏆 리더보드</div>
    <div class="lb-list" id="lb-list"></div>
    <div class="lb-cta">
      <div class="lb-cta-text">매크로 공부 제대로 하고 순위 올리기 👇</div>
      <div class="lb-cta-row">
        <a class="lb-cta-btn ch-tg" href="https://t.me/macro_OK" target="_blank">📡 텔레그램</a>
        <a class="lb-cta-btn ch-yt" href="https://www.youtube.com/@simple_insight" target="_blank">▶️ 유튜브</a>
      </div>
    </div>
    <div class="back-btn"><button class="btn btn-secondary" id="btn-lb-back">← 돌아가기</button></div>
  </div>
</div>
<script>
// ════════════════════════════════════════════════════
//  ★ 설정 — 아래 링크를 본인 것으로 바꾸세요 ★
// ════════════════════════════════════════════════════
var GAME_URL = ''+GAME_URL;
var TG_URL   = ''+TG_URL;
var YT_URL   = ''+YT_URL;
// ════════════════════════════════════════════════════

(function(){
// ── PARTICLES ──
var pc=document.getElementById('particles');var pcl=['#00E5A0','#FF6B9D','#4ECDC4','#A78BFA','#FFD93D'];
for(var i=0;i<18;i++){var pp=document.createElement('div');pp.className='particle';var ss=3+Math.random()*5;pp.style.cssText='width:'+ss+'px;height:'+ss+'px;left:'+Math.random()*100+'%;background:'+pcl[i%pcl.length]+';animation-duration:'+(6+Math.random()*8)+'s;animation-delay:'+Math.random()*6+'s;bottom:'+(-10-Math.random()*20)+'%';pc.appendChild(pp)}

// ── FAKE LEADERBOARD ──
var FAKE_NAMES=[
"매크로전사","차트요정","개미왕","금리헌터","GDP킬러","채권도사","연준워쳐","인플레파이터","환율닌자","CPI마스터",
"버핏주니어","파월팬","이코노K","경제쏠져","수익률왕","매크로학도","지표분석가","금융덕후","투자고수","레버리지맨",
"달러매니아","국채왕","고용전문가","경기선행자","재정통","데이터러버","시장관찰자","금리예측왕","변동성러버","PCE전문가",
"숏박스팬","매크로덕후","경제학도","지표러너","채권러너","연준매니아","고금리시대","인플레전사","노동시장통","LEI분석가",
"재정전문가","경제뉴비","매크로고수","투자연구원","차트리더","금융학도","경기순환러","환율왕","스프레드킹","매크로케이팬"
];
var FAKE_SCORES=[1780,1650,1520,1480,1390,1340,1280,1220,1150,1100,1050,1010,970,930,890,850,810,780,740,710,680,650,620,590,560,530,500,475,450,425,400,380,360,340,320,300,280,260,240,220,200,185,170,155,140,125,110,95,80,65];
var FAKE_LB=FAKE_NAMES.map(function(n,i){var s=FAKE_SCORES[i];var tier=s>=1200?"\u{1F3C6}":s>=800?"\u{1F4C8}":s>=500?"\u{1F4CA}":s>=300?"\u{1F423}":"\u{1FAE0}";return{name:n,score:s,tier:tier,fake:true}});

// ── QUESTIONS ──
var QUESTIONS={
easy:[
  {q:"\uc5f0\uc900(Fed)\uc758 \ubaa9\ud45c 2\uac00\uc9c0\ub294?",o:["\uacbd\uc81c \uc131\uc7a5\uacfc \uc7ac\uc815 \uac74\uc804\uc131","\ubb3c\uac00 \uc548\uc815\uacfc \ucd5c\ub300 \uace0\uc6a9","\ud658\uc728 \uc548\uc815\uacfc \uc218\ucd9c \ucd09\uc9c4","\uae08\uc735 \uc548\uc815\uacfc \uaddc\uc81c \uac15\ud654"],a:1},
  {q:"GDP\ub97c \uad6c\uc131\ud558\ub294 \ud56d\ubaa9\uc774 \uc544\ub2cc \uac83\uc740?",o:["\uc18c\ube44 (C)","\ud22c\uc790 (I)","\uc138\uae08 (T)","\uc21c\uc218\ucd9c (NX)"],a:2},
  {q:"\ubbf8\uad6d GDP\uc5d0\uc11c \uac00\uc7a5 \ud070 \ube44\uc911\uc744 \ucc28\uc9c0\ud558\ub294 \uac74?",o:["\uc815\ubd80 \uc9c0\ucd9c","\ubbfc\uac04 \ud22c\uc790","\uac1c\uc778 \uc18c\ube44","\uc21c\uc218\ucd9c"],a:2},

async function initAudio(){
  if(audioReady)return;
  try{
    await Tone.start();Tone.Transport.bpm.value=132;
    sfxSynth=new Tone.PolySynth(Tone.Synth,{oscillator:{type:'triangle'},envelope:{attack:0.01,decay:0.12,sustain:0,release:0.08},volume:-10}).toDestination();
    var bass=new Tone.Synth({oscillator:{type:'square'},envelope:{attack:0.005,decay:0.12,sustain:0.3,release:0.05},volume:-20}).toDestination();
    var lead=new Tone.Synth({oscillator:{type:'square'},envelope:{attack:0.005,decay:0.08,sustain:0.15,release:0.05},volume:-18}).toDestination();
    var arp=new Tone.Synth({oscillator:{type:'triangle'},envelope:{attack:0.005,decay:0.06,sustain:0.08,release:0.04},volume:-22}).toDestination();
    bgmBass=new Tone.Sequence(function(t,n){if(n)bass.triggerAttackRelease(n,'16n',t)},['C2','C2',null,'C2','C2',null,'C2',null,'A1','A1',null,'A1','A1',null,'A1',null,'F1','F1',null,'F1','F1',null,'F1',null,'G1','G1',null,'G1','G1','G1','G1',null],'8n');
    bgmLead=new Tone.Sequence(function(t,n){if(n)lead.triggerAttackRelease(n,'16n',t)},['C4',null,'E4','G4',null,'C5',null,'G4','A3',null,'C4','E4',null,'A4',null,'E4','F3',null,'A3','C4',null,'F4',null,'C4','G3',null,'B3','D4','G4',null,'D4',null],'8n');
    bgmArp=new Tone.Sequence(function(t,n){if(n)arp.triggerAttackRelease(n,'32n',t)},['C5','E5','G5','C6','G5','E5','C5','E5','A4','C5','E5','A5','E5','C5','A4','C5','F4','A4','C5','F5','C5','A4','F4','A4','G4','B4','D5','G5','D5','B4','G4','B4'],'16n');
    bgmBass.start(0);bgmLead.start(0);bgmArp.start(0);audioReady=true;
  }catch(e){console.log('Audio init failed',e)}
}
function startBGM(){if(!audioReady||!state.soundOn)return;Tone.Transport.start();state.bgmStarted=true}
function stopBGM(){try{Tone.Transport.stop()}catch(e){}state.bgmStarted=false}
function playCorrect(){if(!audioReady||!state.soundOn)return;sfxSynth.triggerAttackRelease(['E5','G5'],'16n',Tone.now());sfxSynth.triggerAttackRelease(['G5','C6'],'16n',Tone.now()+0.07)}
function playWrong(){if(!audioReady||!state.soundOn)return;sfxSynth.triggerAttackRelease(['C3','Eb3'],'8n',Tone.now())}
function playEnding(){if(!state.soundOn)return;try{endingAudio.currentTime=0;var p=endingAudio.play();if(p&&p.catch)p.catch(function(){})}catch(e){}}
function vibrate(ms){try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}

function $(id){return document.getElementById(id)}
function showScreen(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active')});$(id).classList.add('active')}
function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=a[i];a[i]=a[j];a[j]=tmp}return a}
function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showScorePopup(text,type){var el=document.createElement('div');el.className='score-pop '+(type||'bonus');el.textContent=text;el.style.bottom='45%';document.body.appendChild(el);setTimeout(function(){el.remove()},950)}
function createConfetti(ct){var cl=['#00E5A0','#FF6B9D','#FFD93D','#4ECDC4','#A78BFA','#FF4757'];for(var i=0;i<40;i++){var el=document.createElement('div');el.className='confetti';el.style.cssText='left:'+Math.random()*100+'%;top:-10px;width:'+(5+Math.random()*6)+'px;height:'+(5+Math.random()*6)+'px;background:'+cl[Math.floor(Math.random()*cl.length)]+';animation-delay:'+Math.random()*1.5+'s;animation-duration:'+(2+Math.random()*2.5)+'s;border-radius:'+(Math.random()>.5?'50%':'2px');ct.appendChild(el);setTimeout(function(){el.remove()},5000)}}
function showCountdown(){return new Promise(function(resolve){var ov=document.createElement('div');ov.className='cd-overlay';document.body.appendChild(ov);var nums=['3','2','1','GO!'];var idx=0;(function next(){if(idx>=nums.length){ov.remove();return resolve()}ov.innerHTML='<div class="cd-num">'+nums[idx]+'</div>';idx++;setTimeout(next,600)})()})}

function prepareQuestions(){
  var e=shuffle(QUESTIONS.easy).slice(0,5).map(function(q){return Object.assign({},q,{diff:'easy'})});
  var n=shuffle(QUESTIONS.normal).slice(0,5).map(function(q){return Object.assign({},q,{diff:'normal'})});
  var h=shuffle(QUESTIONS.hard).slice(0,5).map(function(q){return Object.assign({},q,{diff:'hard'})});
  return e.concat(n,h).map(function(q){var idx=q.o.map(function(_,i){return i});var sh=shuffle(idx);return Object.assign({},q,{o:sh.map(function(i){return q.o[i]}),a:sh.indexOf(q.a)})});
}

function renderQuestion(){
  var q=state.questions[state.current];if(!q)return endGame();
  state.answered=false;
  $('q-num').textContent=state.current+1;$('q-total').textContent=state.questions.length;
  $('lives').innerHTML='\u2764\ufe0f'.repeat(state.lives)+'\u{1F5A4}'.repeat(state.maxLives-state.lives);
  var badge=$('diff-badge');badge.className='diff-badge';
  if(q.diff==='easy'){badge.textContent='EASY';badge.classList.add('diff-easy')}
  else if(q.diff==='normal'){badge.textContent='NORMAL';badge.classList.add('diff-normal')}
  else{badge.textContent='HARD';badge.classList.add('diff-hard')}
  $('question-text').textContent=q.q;
  var labels=['A','B','C','D'];
  $('options').innerHTML=q.o.map(function(opt,i){return '<button class="option-btn" data-idx="'+i+'"><span class="ol">'+labels[i]+'</span><span>'+opt+'</span></button>'}).join('');
  $('options').querySelectorAll('.option-btn').forEach(function(btn){btn.addEventListener('click',function(){handleAnswer(parseInt(btn.dataset.idx))})});
  var cb=$('combo-badge');if(state.combo>=2){cb.textContent='\u{1F525} '+state.combo+' COMBO';cb.classList.add('show')}else{cb.classList.remove('show')}
  startTimer();
}
function startTimer(){state.timeLeft=15;var fill=$('timer-fill');fill.style.width='100%';fill.className='timer-fill';clearInterval(state.timer);state.timer=setInterval(function(){state.timeLeft-=0.1;var pct=Math.max(0,(state.timeLeft/15)*100);fill.style.width=pct+'%';if(pct<20)fill.className='timer-fill danger';else if(pct<40)fill.className='timer-fill warn';if(state.timeLeft<=0){clearInterval(state.timer);handleTimeout()}},100)}

function handleAnswer(idx){
  if(state.answered)return;state.answered=true;clearInterval(state.timer);
  var q=state.questions[state.current];var btns=$('options').querySelectorAll('.option-btn');
  btns.forEach(function(b){b.classList.add('locked')});
  if(idx===q.a){
    btns[idx].classList.remove('locked');btns[idx].classList.add('correct');state.correct++;state.combo++;
    if(state.combo>state.maxCombo)state.maxCombo=state.combo;
    var mult=state.combo>=4?2.5:state.combo>=3?2:state.combo>=2?1.5:1;
    var base=q.diff==='hard'?100:q.diff==='normal'?75:50;
    var timeBonus=Math.round(state.timeLeft*(q.diff==='hard'?6:q.diff==='normal'?4:3));
    var pts=Math.round((base+timeBonus)*mult);state.score+=pts;
    playCorrect();showScorePopup('+'+pts,'bonus');
    if(state.combo>=2)showScorePopup('\u{1F525} x'+mult+' COMBO!','combo');
  }else{
    btns[idx].classList.remove('locked');btns[idx].classList.add('wrong');
    btns[q.a].classList.remove('locked');btns[q.a].classList.add('correct');
    state.lives--;state.combo=0;
    $('lives').innerHTML='\u2764\ufe0f'.repeat(Math.max(0,state.lives))+'\u{1F5A4}'.repeat(state.maxLives-Math.max(0,state.lives));
    playWrong();vibrate(120);
  }
  setTimeout(function(){if(state.lives<=0)endGame();else{state.current++;renderQuestion()}},1100);
}
function handleTimeout(){if(state.answered)return;state.answered=true;var q=state.questions[state.current];var btns=$('options').querySelectorAll('.option-btn');btns.forEach(function(b){b.classList.add('locked')});btns[q.a].classList.remove('locked');btns[q.a].classList.add('correct');state.lives--;state.combo=0;$('lives').innerHTML='\u2764\ufe0f'.repeat(Math.max(0,state.lives))+'\u{1F5A4}'.repeat(state.maxLives-Math.max(0,state.lives));playWrong();vibrate(120);setTimeout(function(){if(state.lives<=0)endGame();else{state.current++;renderQuestion()}},1100)}

function buildLeaderboard(){
  var lb=FAKE_LB.map(function(e){return Object.assign({},e)});
  var tier=getTier(state.correct);
  lb.push({name:state.name||'???',score:state.score,tier:tier.icon,fake:false});
  lb.sort(function(a,b){return b.score-a.score});
  return lb;
}

function endGame(){
  clearInterval(state.timer);stopBGM();
  var tier=getTier(state.correct);var total=state.current;var isGameOver=state.lives<=0;
  playEnding();
  $('tier-icon').textContent=tier.icon;
  $('tier-name').textContent=tier.name;$('tier-name').style.color=tier.color;
  $('tier-sub').textContent=tier.sub;
  $('result-score').textContent=state.score.toLocaleString()+'\uc810';
  var detail=isGameOver?'\u{1F480} \uac8c\uc784\uc624\ubc84! '+state.correct+'/'+total+' \uc815\ub2f5':'\u{1F389} \uc644\uc8fc! '+state.correct+'/'+total+' \uc815\ub2f5 \u00b7 \u2764\ufe0f'+state.lives+'\uac1c \ub0a8\uc74c';
  if(state.maxCombo>=2)detail+=' \u00b7 \u{1F525}\ucd5c\ub300 '+state.maxCombo+'\ucf64\ubcf4';
  $('result-detail').textContent=detail;
  var lb=buildLeaderboard();
  var rank=-1;for(var i=0;i<lb.length;i++){if(!lb[i].fake){rank=i+1;break}}
  if(rank>0){$('result-rank').innerHTML='\uc804\uccb4 <strong>'+rank+'\uc704</strong> / '+lb.length+'\uba85';$('result-rank').style.display=''}else{$('result-rank').style.display='none'}
  showScreen('screen-result');
  if(state.correct>=8)createConfetti($('result-wrap'));
}

function renderLeaderboard(){
  var list=$('lb-list');
  var lb=buildLeaderboard();
  if(!lb.length){list.innerHTML='<div class="lb-empty">\uc544\uc9c1 \uae30\ub85d\uc774 \uc5c6\uc5b4\uc694!</div>';return}
  var myIdx=-1;for(var i=0;i<lb.length;i++){if(!lb[i].fake){myIdx=i;break}}
  var show=lb.slice(0,15);
  var needMe=myIdx>=15;
  var html=show.map(function(e,i){var isMe=!e.fake;return '<div class="lb-row'+(isMe?' me':'')+'"><div class="lb-rank">'+(i+1)+'</div><div class="lb-name">'+escHtml(e.name)+'</div><div class="lb-score">'+e.score.toLocaleString()+'</div><div class="lb-tier">'+(e.tier||'')+'</div></div>'}).join('');
  if(needMe&&myIdx>=0){
    html+='<div style="text-align:center;color:rgba(255,255,255,.3);padding:6px;font-size:12px">\u00b7 \u00b7 \u00b7</div>';
    html+='<div class="lb-row me"><div class="lb-rank">'+(myIdx+1)+'</div><div class="lb-name">'+escHtml(lb[myIdx].name)+'</div><div class="lb-score">'+lb[myIdx].score.toLocaleString()+'</div><div class="lb-tier">'+(lb[myIdx].tier||'')+'</div></div>';
  }
  list.innerHTML=html;
}

function shareResult(){
  var tier=getTier(state.correct);var total=state.current;
  var bar='\u2588'.repeat(state.correct)+'\u2591'.repeat(total-state.correct);
  var text='\ud83c\udfae \ub9e4\ud06c\ub85c \ub9c8\uc2a4\ud130 \uc544\ucf00\uc774\ub4dc\n\n'+tier.icon+' '+tier.name+'\n'+bar+'\n\u2705 '+state.correct+'/'+total+' \uc815\ub2f5 \u00b7 \ud83d\udcaf '+state.score.toLocaleString()+'\uc810\n';
  if(state.maxCombo>=2)text+='\ud83d\udd25 \ucd5c\ub300 '+state.maxCombo+'\ucf64\ubcf4!\n';
  text+='\n\ub098\ub3c4 \ub3c4\uc804\ud558\uae30 \u2192 '+GAME_URL;
  text+='\n\n\ud83d\udce1 \ud154\ub808\uadf8\ub7a8: '+TG_URL;
  text+='\n\u25b6\ufe0f \uc720\ud29c\ube0c: '+YT_URL;
  if(navigator.share){navigator.share({title:'\ub9e4\ud06c\ub85c \ub9c8\uc2a4\ud130 \uc544\ucf00\uc774\ub4dc',text:text}).catch(function(){fbCopy(text)})}
  else{fbCopy(text)}
}
function fbCopy(text){
  var ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(ta);ta.focus();ta.select();
  try{document.execCommand('copy');var t=$('share-toast');t.classList.add('show');setTimeout(function(){t.classList.remove('show')},2000)}catch(e){}
  document.body.removeChild(ta);
}

async function startGame(){await initAudio();try{endingAudio.play().then(function(){endingAudio.pause();endingAudio.currentTime=0}).catch(function(){})}catch(e){}state.name=$('nickname').value.trim();state.questions=prepareQuestions();state.current=0;state.correct=0;state.score=0;state.lives=3;state.combo=0;state.maxCombo=0;showScreen('screen-game');await showCountdown();startBGM();renderQuestion()}

// Set links dynamically
document.querySelectorAll('.ch-tg').forEach(function(el){el.href=TG_URL});
document.querySelectorAll('.ch-yt').forEach(function(el){el.href=YT_URL});
document.querySelectorAll('a[href*="t.me"]').forEach(function(el){el.href=TG_URL});
document.querySelectorAll('a[href*="youtube"]').forEach(function(el){el.href=YT_URL});

$('nickname').addEventListener('input',function(){$('btn-start').disabled=!$('nickname').value.trim()});
$('nickname').addEventListener('keydown',function(e){if(e.key==='Enter'&&$('nickname').value.trim())startGame()});
$('btn-start').addEventListener('click',startGame);
$('btn-retry').addEventListener('click',function(){try{endingAudio.pause()}catch(e){}showScreen('screen-start');$('nickname').focus()});
$('btn-share').addEventListener('click',shareResult);
$('btn-sound').addEventListener('click',function(){state.soundOn=!state.soundOn;$('btn-sound').textContent=state.soundOn?'\u{1F50A}':'\u{1F507}';if(!state.soundOn){stopBGM();try{endingAudio.pause()}catch(e){}}else if(!state.bgmStarted)startBGM()});
$('btn-lb-start').addEventListener('click',function(){state.previousScreen='screen-start';renderLeaderboard();showScreen('screen-lb')});
$('btn-lb-result').addEventListener('click',function(){state.previousScreen='screen-result';renderLeaderboard();showScreen('screen-lb')});
$('btn-lb-back').addEventListener('click',function(){showScreen(state.previousScreen)});
document.body.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault()},{passive:false});
})();
</script>
</body>
